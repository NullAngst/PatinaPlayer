name: Release

# Builds the AppImage, the Android APK and the FreeBSD tarball from a tag
# and attaches them to that tag's release, which has to exist already.
# Nothing here runs on a push: make the release and its tag on the Releases
# page first, then run this from Actions, Run workflow, with that tag picked
# under "Use workflow from". Pushes to main and pull requests only run CI
# and Servers. To try the builds without a release, run Test build instead,
# on any branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fails in seconds, before 15 minutes of builds, when the run can't end in
  # a release: started on a branch, or no release made for the tag yet.
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Check this run is on a tag with a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::This was run on the branch '$GITHUB_REF_NAME', not a tag. Make the release and its tag on the Releases page, then run this workflow again and pick that tag under 'Use workflow from'. To try the builds without a release, run Test build."
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::There's no release for the tag '$GITHUB_REF_NAME' yet. Go to Releases, draft a new release on that tag and publish it, then run this workflow again."
            exit 1
          fi
          echo "Building $GITHUB_REF_NAME for its release."

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
      release: true
    secrets: inherit

  # Attaches what was built to the tag's existing release, once every build
  # is done, so they never race. If one build fails, the others still ship
  # (and the run shows red for the one that didn't). --clobber lets a rerun
  # on the same tag replace the files.
  publish:
    needs: [preflight, build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: PatinaPlayer-*
          path: dist
          merge-multiple: true

      - name: See what was built
        id: built
        run: |
          ls -l dist || true
          if ls dist/PatinaPlayer-*.apk >/dev/null 2>&1; then
            echo "apk=true" >> "$GITHUB_OUTPUT"
          fi

      # Signed SLSA build provenance for the APK: who built it, from which
      # commit and workflow. Signed through Sigstore with this run's OIDC
      # identity and listed on the repository's Attestations page.
      - name: Attest the APK
        if: steps.built.outputs.apk == 'true'
        uses: actions/attest@v4
        with:
          subject-path: dist/PatinaPlayer-*.apk

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- dist/PatinaPlayer-*
          if [ ! -e "$1" ]; then
            echo "::error::No build files came through to attach."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "$@" --clobber --repo "$GITHUB_REPOSITORY"
