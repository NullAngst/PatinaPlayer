name: build

# Pushes and PRs run the checks. Releases are made by hand:
#   1. Releases, Draft a new release, make a new tag (v1.2.3), publish.
#   2. Actions, build, Run workflow, pick that tag under "Use workflow
#      from", Run workflow.
# The checks run on the tag, then the release job attaches the binaries
# to the release. Pushing a tag on its own builds nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here needs to push with git, so keep the token out of
          # .git/config where any build or test step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Build web assets
        working-directory: web/src
        run: npm ci --ignore-scripts && npm run build
      - name: Module files
        run: |
          if [ -f go.sum ]; then
            go mod verify
          else
            echo "::warning::go.sum is missing. Run the deps workflow once to commit it."
            go mod tidy
          fi
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go test -race ./...

  # Same engine API the server talks to. The runner's own Docker daemon is
  # used instead of docker:dind, since it is a real engine with nothing extra
  # to set up.
  integration-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here needs to push with git, so keep the token out of
          # .git/config where any build or test step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Module files
        run: if [ ! -f go.sum ]; then go mod tidy; fi
      - name: Start a labeled container
        run: >
          docker run -d --name fl-it
          --label com.docker.compose.project=fltest
          --label com.docker.compose.service=web
          --label com.docker.compose.project.working_dir=/opt/fltest
          alpine:latest sleep 300
      - name: Integration tests
        env:
          FLEETLING_IT_HOST: /var/run/docker.sock
        run: go test -tags integration -count=1 -v ./internal/engine/

  # The same integration tests against rootful Podman's Docker-compatible
  # socket. This is the proof that a stack deploys on Podman from the same
  # compose file; the sandbox Fleetling was built in had no Podman.
  integration-podman:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No job here needs to push with git, so keep the token out of
          # .git/config where any build or test step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Module files
        run: if [ ! -f go.sum ]; then go mod tidy; fi
      - name: Start the rootful Podman socket
        run: |
          podman --version
          sudo systemctl start podman.socket
          # Let the runner user reach the root-owned socket, nothing more.
          sudo setfacl -m "u:$(id -un):x" /run/podman
          sudo setfacl -m "u:$(id -un):rw" /run/podman/podman.sock
      - name: Start a labeled container
        run: >
          sudo podman run -d --name fl-it
          --label com.docker.compose.project=fltest
          --label com.docker.compose.service=web
          --label com.docker.compose.project.working_dir=/opt/fltest
          docker.io/library/alpine:latest sleep 300
      - name: Integration tests
        env:
          FLEETLING_IT_HOST: /run/podman/podman.sock
          FLEETLING_IT_KIND: Podman
        run: go test -tags integration -count=1 -v ./internal/engine/

  # The image itself: proves the kompose download and its checksum, the
  # podlet build, and that every tool runs in the final image.
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: docker build --pull -t fleetling:ci .
      - name: Every tool runs
        run: |
          docker run --rm fleetling:ci version
          docker run --rm --entrypoint docker fleetling:ci compose version
          docker run --rm --entrypoint kompose fleetling:ci version
          docker run --rm --entrypoint podlet fleetling:ci --version

  release:
    # Only a manual run attaches anything. Run on a branch, the checks run
    # and this job stops with a message saying to pick the tag.
    if: github.event_name == 'workflow_dispatch'
    needs: [test, integration-docker, integration-podman, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Run on a tag with a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::This run is on the branch $GITHUB_REF_NAME. Pick the release's tag under \"Use workflow from\" instead."
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::There is no release for $GITHUB_REF_NAME. Make it on the Releases page first, then run this again on the tag."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # No job here needs to push with git, so keep the token out of
          # .git/config where any build or test step could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Build web assets
        working-directory: web/src
        run: npm ci --ignore-scripts && npm run build
      - name: Module files
        run: if [ ! -f go.sum ]; then go mod tidy; fi
      - name: Build static binaries
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/fleetling-linux-$arch ./cmd/fleetling
          done
          cd dist && sha256sum fleetling-* > SHA256SUMS
      # GitHub's own CLI, which every runner has, so no third-party action
      # holds this job's write token. --clobber replaces the files if the
      # workflow is run again on the same tag.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
