name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 24.04 rather than 22.04: the decoder uses FFmpeg's channel layout
    # API from 5.1, and 22.04 ships FFmpeg 4.4.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang ffmpeg libmp3lame0 \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libavfilter-dev libavdevice-dev \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            dbus alsa-utils

      - name: Install Rust (latest stable)
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      # No pinned versions: pull the newest compatible crates on every run.
      - name: Refresh lockfile
        run: cargo update

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy without PipeWire
        run: cargo clippy -p patina-core --no-default-features -- -D warnings

      - name: Tests (includes the gapless and seek checks)
        run: cargo test --workspace

      # Bit-perfect through a real ALSA kernel driver. The ALSA file-plugin
      # test above already checks every bit on every run; this one needs the
      # snd-aloop module, which hosted runners may or may not be able to
      # load, so it never fails the build.
      - name: Bit-perfect loopback on snd-aloop
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" || true
          sudo modprobe snd-aloop
          sudo chmod a+rw /dev/snd/*
          cargo test -p patina-core --test bitperfect -- --ignored

      # Per-device EQ follows PipeWire's default sink. A private PipeWire
      # with two null sinks stands in for headphones and speakers.
      - name: Per-device EQ on a real PipeWire
        run: |
          sudo apt-get install -y --no-install-recommends pipewire pipewire-bin wireplumber
          export XDG_RUNTIME_DIR=$(mktemp -d)
          dbus-daemon --session --address="unix:path=$XDG_RUNTIME_DIR/bus" --fork
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          pipewire & sleep 1
          wireplumber & sleep 2
          for n in headphones speakers; do
            pw-cli create-node adapter "{ factory.name=support.null-audio-sink node.name=$n media.class=Audio/Sink node.description=\"Test $n\" audio.position=[FL FR] object.linger=true }"
          done
          sleep 1
          cargo test -p patina-core --test eq pipewire -- --ignored
          cargo test -p patina-core --test output_controls pipewire -- --ignored

      - name: Build TUI and GUI
        run: cargo build --release -p patina-tui -p patina-gui

      - uses: actions/upload-artifact@v4
        with:
          name: patinaplayer-x86_64
          path: |
            target/release/patinaplayer-tui
            target/release/patinaplayer
