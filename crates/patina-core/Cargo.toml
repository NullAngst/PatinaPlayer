[package]
name = "patina-core"
description = "Shared core for PatinaPlayer: audio engine, queue, playback state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pipewire"]
pipewire = ["dep:pipewire"]

[dependencies]
ffmpeg-next = "9"
pipewire = { version = "0.10", optional = true }
alsa = "0.12"
rtrb = "0.4"
crossbeam-channel = "0.5"
thiserror = "2"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
lofty = "0.25"
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
dirs = "7"
reqwest = { version = "0.13", features = ["blocking", "gzip"] }
rss = "2"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "clock"] }

[dev-dependencies]
tempfile = "3"
