[package]
name = "patina-core"
description = "Shared core for PatinaPlayer: audio engine, queue, playback state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pipewire"]
pipewire = ["dep:pipewire"]
# Link FFmpeg statically, from whatever pkg-config finds first. The AppImage
# build points it at the audio-only FFmpeg from packaging/build-ffmpeg.sh.
static-ffmpeg = ["ffmpeg-next/static"]

[dependencies]
# Only decoding, demuxing and filters: no devices, no scaling.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "filter"] }
pipewire = { version = "0.10", optional = true }
alsa = "0.12"
# Device reservation over D-Bus, for the bit-perfect output.
zbus = "5"
rtrb = "0.4"
crossbeam-channel = "0.5"
thiserror = "2"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
lofty = "0.25"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Subsonic token auth (salted MD5) and Ampache handshakes (SHA-256).
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
toml = "1"
toml_edit = "0.25"
dirs = "7"
reqwest = { version = "0.13", features = ["blocking", "gzip", "query", "form"] }
rss = "2"
url = "2"
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "clock"] }
# EBU R128 loudness and true peak, for leveling tracks that have no ReplayGain tags.
ebur128 = "0.1"
# Sample rate conversion, for fixed-rate output and for gapless joins
# between songs at different rates.
rubato = "5"

[dev-dependencies]
tempfile = "3"
