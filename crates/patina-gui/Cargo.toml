[package]
name = "patina-gui"
description = "PatinaPlayer desktop frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "patinaplayer"
path = "src/main.rs"

[features]
# See patina-core. Used by the AppImage build.
static-ffmpeg = ["patina-core/static-ffmpeg"]

[dependencies]
patina-core = { path = "../patina-core" }
slint = "1.18"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# The tray icon (StatusNotifierItem). Its own small executor, no tokio.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.18"
